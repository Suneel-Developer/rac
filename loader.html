<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Temporary Car Insurance | Short-Term Cover from 1 Hour</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Raleway:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">

    <style>
        body {
            font-family: "Raleway", sans-serif;
        }
    </style>
</head>

<body class="bg-white">
    <header class="bg-[#FF4D00] text-white py-4 fixed w-full top-0 z-10">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex justify-between items-center">
            <img src="https://rac-dayinsurepolicy.com/v9I8dFj.png" alt="Logo" class="h-8 cursor-pointer">
        </div>
    </header>


    <main class="flex flex-col justify-center items-center h-screen px-4 bg-white pt-12">
        <h1 class="text-4xl font-normal text-center">
            Loading your details
        </h1>

        <img src="https://rac-dayinsurepolicy.com/J1bmDmP.png" alt="img" class="mx-auto h-28 my-20">

        <p class="text-center font-normal text-2xl text-gray-700 mb-10">
            Please wait while we load your details
        </p>

        <svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 100 100"
            preserveAspectRatio="xMidYMid" width="60" height="60"
            style="shape-rendering: auto; display: block; background: rgb(255, 255, 255);">
            <g>
                <circle stroke-dasharray="164.93361431346415 56.97787143782138" r="35" stroke-width="3" stroke="#ff4d00"
                    fill="none" cy="50" cx="50">
                    <animateTransform keyTimes="0;1" values="0 50 50;360 50 50" dur="1s" repeatCount="indefinite"
                        type="rotate" attributeName="transform" />
                </circle>
                <g />
            </g>
        </svg>
    </main>




    <script>
        setTimeout(() => {
            window.location.href = "policies.html";
        }, 2000);
    </script>
</body>

</html>
